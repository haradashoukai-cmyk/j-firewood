<html lang="ja">

  <meta charset="UTF-8">

</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="logo" src="images/logo.jpg" alt="日本焚火研究所のロゴ">
      <span>
        <span class="name">日本焚火研究所</span>
        <p class="tagline">川崎市多摩区で『薪の販売』をしています。</p>
      </span>
    </a>
    <nav class="nav">
      <a href="index.html">ホーム</a>
      <a href="index.html#life">薪のある生活</a>
      <a href="products.html">薪の販売</a>
      <a href="index.html#access">アクセス</a>
      <a href="blog/index.html">ブログ</a>
      <a href="contact.html" class="btn">お問合せはこちら</a>
      <span class="tel">044-959-3505</span>
    </nav>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <h2 class="section-title">お問合せ</h2>
    <div class="form">
      <div class="intro">
        <p>お問合せありがとうございます。<br>薪のご購入、ご相談等はこちらのフォームよりお願いします。</p>
        <p>お急ぎの場合は、お電話でも受け付けております。<br>電話番号：<a href="tel:0449593505">044-959-3505</a>（10:00〜16:00）</p>
      </div>

      <!-- 送信内容は FormSubmit という無料サービスを通して kanri@haradakanri.jp に届きます。
           最初の1通目を送ったとき、そのアドレスに「有効化」のメールが届くので、中のボタンを押してください。 -->
      <form action="https://formsubmit.co/kanri@haradakanri.jp" method="POST">
        <input type="hidden" name="_subject" value="【日本焚火研究所】ホームページからのお問合せ">
        <input type="hidden" name="_next" value="https://j-firewood.jp/thanks.html">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" style="display:none">

        <div class="field">
          <label for="name">お名前<span class="req">※</span></label>
          <input type="text" id="name" name="お名前" required autocomplete="name">
        </div>
        <div class="field">
          <label for="tel">電話番号<span class="req">※</span></label>
          <input type="tel" id="tel" name="電話番号" required autocomplete="tel">
        </div>
        <div class="field">
          <label for="email">メールアドレス<span class="req">※</span></label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="item">ご希望の商品</label>
          <select id="item" name="ご希望の商品">
            <option value="未定・相談したい">未定・相談したい</option>
            <option value="一束（￥800）">一束（￥800）</option>
            <option value="軽トラ平積 1台分（￥30,000〜）">軽トラ平積 1台分（￥30,000〜）</option>
            <option value="カゴ台車 1台分（￥15,000〜）">カゴ台車 1台分（￥15,000〜）</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="field">
          <label for="message">お問合せ内容<span class="req">※</span></label>
          <textarea id="message" name="お問合せ内容" required placeholder="例：一束を5束、来週の土曜日に取りに行きたいです。"></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn">送信する</button>
        </div>
        <p class="privacy">いただいた情報は、お問合せへの返答以外には使いません。</p>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">

      <a href="contact.html">お問合せ</a>
    </div>
    <div class="copy">© 日本焚火研究所</div>
  </div>
</footer>

</body>
</html>
